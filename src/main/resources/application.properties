# =============================================
# SERVIDOR
# =============================================
spring.application.name=techgear
server.port=8080

# =============================================
# POSTGRESQL - Base de datos local TechGear
# =============================================
# Usamos las variables que definiste en tu Dockerfile
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:TechGear}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE
# Usamos "validate" para no tocar tus tablas existentes
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# LOGGING
# =============================================
logging.level.com.techgear=DEBUG
