version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: TechGear
      DB_USER: postgres
      DB_PASSWORD: 12345
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_DB: TechGear
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"